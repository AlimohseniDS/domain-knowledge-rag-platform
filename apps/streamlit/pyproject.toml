[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-platform-console"
version = "0.1.0"
description = "Streamlit engineering console for the domain knowledge RAG platform"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_console*"]

[tool.pytest.ini_options]
testpaths = ["../../tests/unit/streamlit"]

[tool.ruff]
line-length = 100
target-version = "py311"
